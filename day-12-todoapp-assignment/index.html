<!DOCTYPE html>

<head>
    <title>TO-DO APP</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="heading">
    <h2>Todo App</h2>
    </div>
<div class="display-field">
    <input type="text" id='todo-input' onkeyup="validate()" placeholder="Enter Task">
    <div class="error" id="error">task is mandatory </div>
    <input type="number" id="todo-input-time"onkeyup="validateTime()" placeholder="Enter Time To complete">
    <div class="timeerror" id="timeerror">Hour cannot be negative</div> 
    <select id="todo-priority">
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
    </select>
    <div class="button-group">
    <button onclick="addTodo()">Add</button>
    <button onclick="sortData()">Sort Data</button>
    </div>
    <ul id="todo-list"></ul>
   </div>
</body>
 <script src="script.js">
    </script>
</html>
