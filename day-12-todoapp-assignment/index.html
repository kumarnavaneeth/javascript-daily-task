<!DOCTYPE html>

<head>
    <title>TO-DO APP</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="heading">
    <h2>Todo App</h2>
    </div>
<div class="display-field">
    <input type="text" id='todo-input' onkeyup="validate()" placeholder="Enter Task">
    <div class="error" id="error">task is mandatory </div>
    <input type="time" id="todo-input-time" placeholder="Enter Time To complete">
    <label><input type="radio"name="status" value="urgent">Urgent</label>
    <label><input type="radio" name="status" value="NotUrgent">notUrgent</label>
    <button onclick="addTodo()">Add</button>
    <button onclick="sortData()">Sort Data</button>
    <ul id="todo-list"></ul>
   </div>
</body>
 <script src="script.js">
    </script>
</html>
